<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunter Login | System</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="login-page">
  <main class="auth-card">
    <p class="eyebrow">SYSTEM ACCESS</p>
    <h1 class="title">Hunter Login</h1>
    <p class="subtitle">Sign in to view your status window</p>
    <p class="login-limit" id="login-limit" aria-live="polite"></p>

    <form action="landing.html" method="get" id="hunterForm">
      <div class="field">
        <label for="username">Hunter ID</label>
        <input type="text" id="username" name="username" placeholder="Enter your hunter ID" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <div class="remember-row">
        <label for="remember">
          <input type="checkbox" id="remember" name="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Enter the gate</button>
      <p class="form-status" id="login-status" aria-live="polite"></p>
    </form>

    <p class="switch-link">Not registered yet? <a href="register.html">Awaken as a hunter</a></p>
  </main>

  <script>
    $(function () {
      var maxAttempts = 3;
      var attempts = 0;
      var form = $("#hunterForm");
      var status = $("#login-status");
      var limit = $("#login-limit");

      function showAttempts(attempts) {
        var remaining = maxAttempts - attempts;
        limit.text("Security limit: " + remaining + " attempt(s) remaining.");
      }

      function lockLogin() {
        form.find("input, button").prop("disabled", true);
        status.text("Login locked after 3 failed attempts.").addClass("is-error");
        limit.text("Security limit reached. Access is locked.").addClass("is-error");
      }

      localStorage.removeItem("hunterLoginAttempts");
      localStorage.removeItem("hunterLoginLocked");
      showAttempts(attempts);

      form.validate({
        errorElement: "span",
        errorClass: "field-error",
        rules: {
          username: {
            required: true
          },
          password: {
            required: true
          }
        },
        messages: {
          username: {
            required: "Please enter your Hunter ID"
          },
          password: {
            required: "Please enter your password"
          }
        },
        submitHandler: function (formElement) {
          var account;

          try {
            account = JSON.parse(localStorage.getItem("hunterAccount"));
          } catch (error) {
            account = null;
          }

          var username = formElement.elements.username.value.trim();
          var password = formElement.elements.password.value;
          var validLogin = account && account.username === username && account.password === password;

          if (validLogin) {
            attempts = 0;
            formElement.submit();
            return;
          }

          attempts += 1;

          if (attempts >= maxAttempts) {
            lockLogin();
            return;
          }

          status.text("Invalid Hunter ID or password. " + (maxAttempts - attempts) + " attempt(s) remaining.").addClass("is-error");
          showAttempts(attempts);
        }
      });
    });
  </script>
</body>
</html>
